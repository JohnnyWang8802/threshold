<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>threshold · 张弓</title>
<style>
  :root{
    --ground:#08090c;
    --smoke:#3a4450;
    --ash:#6a6f78;
    --bone:#e8e0d0;
    --torch:#c98a4b;
    --rule:#1c1f26;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ash)}
  body{
    font:400 13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:28px 20px 34px;gap:18px;
    -webkit-font-smoothing:antialiased;
  }

  .plate{width:100%;max-width:1180px;display:flex;align-items:baseline;
         justify-content:space-between;gap:16px;flex-wrap:wrap}
  .plate h1{
    font:400 21px/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--bone);letter-spacing:.01em;
  }
  .plate h1 em{font-style:italic;color:var(--torch)}
  .plate .meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4d525b}

  .stage{width:100%;max-width:1180px;position:relative;
         border:1px solid var(--rule);background:#05060a}
  canvas{display:block;width:100%;height:auto}

  .rail{width:100%;max-width:1180px;display:flex;align-items:center;
        gap:22px;flex-wrap:wrap}
  .modes{display:flex;gap:2px}
  .modes button{
    font:inherit;font-size:12px;letter-spacing:.06em;
    background:transparent;color:#5a606a;border:1px solid var(--rule);
    padding:7px 13px;cursor:pointer;transition:color .18s,border-color .18s;
  }
  .modes button:hover{color:var(--bone)}
  .modes button[aria-pressed="true"]{color:var(--ground);background:var(--bone);border-color:var(--bone)}
  .modes button:focus-visible,.link:focus-visible{outline:1px solid var(--torch);outline-offset:2px}

  .speed{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
  .speed label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4d525b}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:1px;
    background:var(--rule);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
    background:var(--torch);border:0;
  }
  input[type=range]::-moz-range-thumb{
    width:9px;height:9px;border-radius:50%;background:var(--torch);border:0;
  }

  .link{background:none;border:0;font:inherit;font-size:12px;color:#5a606a;
        cursor:pointer;padding:4px 0;transition:color .18s}
  .link:hover{color:var(--torch)}

  .note{width:100%;max-width:1180px;font-size:11.5px;color:#42474f;line-height:1.7}

  @media (max-width:640px){
    .plate h1{font-size:17px}
    .rail{gap:14px}
    .speed{order:3;width:100%;flex:none}
  }
</style>
</head>
<body>

  <div class="plate">
    <h1>奥德修斯张弓 · <em>以二进制重写</em></h1>
    <div class="meta" id="meta">—</div>
  </div>

  <div class="stage"><canvas id="c"></canvas></div>

  <div class="rail">
    <div class="modes" id="modes">
      <button data-m="shimmer" aria-pressed="true">微光</button>
      <button data-m="rain" aria-pressed="false">数据雨</button>
      <button data-m="decode" aria-pressed="false">解码</button>
      <button data-m="scan" aria-pressed="false">扫描</button>
    </div>
    <div class="speed">
      <label for="sp">速度</label>
      <input id="sp" type="range" min="0" max="200" value="72">
    </div>
    <button class="link" id="toggle">暂停</button>
    <button class="link" id="save">存下这一帧</button>
  </div>

  <p class="note">
    画面里的每一个 0 和 1 都对应原图的一小格。字符本身在动，亮度分布不动——所以无论怎么翻转、流淌，图像始终立在那里。
  </p>

<script>
const GRID = __GRID__;

const CW = 8, CH = 12;                       // one character cell, in px
const COLS = GRID.cols, ROWS = GRID.rows, N = COLS * ROWS;

// ---- unpack: 4 bytes per cell -> r, g, b, base character -------------
const raw = Uint8Array.from(atob(GRID.data), c => c.charCodeAt(0));
const R = new Uint8Array(N), G = new Uint8Array(N), B = new Uint8Array(N);
const BASE = new Uint8Array(N), CUR = new Uint8Array(N), LUM = new Float32Array(N);
for (let i = 0; i < N; i++) {
  R[i] = raw[i*4]; G[i] = raw[i*4+1]; B[i] = raw[i*4+2];
  BASE[i] = CUR[i] = raw[i*4+3];
  LUM[i] = (0.2126*R[i] + 0.7152*G[i] + 0.0722*B[i]) / 255;
}
const GLYPH = ['1', '0'];

// ---- canvas ----------------------------------------------------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = COLS*CW*dpr; cv.height = ROWS*CH*dpr;
cv.style.aspectRatio = (COLS*CW) + ' / ' + (ROWS*CH);
ctx.scale(dpr, dpr);
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.font = 'bold ' + (CW*1.45) + 'px ui-monospace,"SF Mono",Menlo,Consolas,monospace';

document.getElementById('meta').textContent =
  COLS + ' × ' + ROWS + ' · ' + N.toLocaleString() + ' 个字符';

// ---- colour bucketing: one fillStyle change per shade, not per cell ---
const QB = 5, NB = 1 << (QB*3), QS = 8 - QB;
const bucket = new Array(NB), stamp = new Int32Array(NB), keyList = new Int32Array(NB);
const colStr = new Array(NB);
let frameId = 0;

function shade(key){
  let s = colStr[key];
  if (s === undefined){
    const r = ((key >> (QB*2)) & 31) << QS, g = ((key >> QB) & 31) << QS, b = (key & 31) << QS;
    s = colStr[key] = 'rgb(' + (r|4) + ',' + (g|4) + ',' + (b|4) + ')';
  }
  return s;
}

// ---- per-mode state --------------------------------------------------
const colPos = new Float32Array(COLS), colSpd = new Float32Array(COLS), colLen = new Float32Array(COLS);
function seedRain(){
  for (let x = 0; x < COLS; x++){
    colPos[x] = -Math.random()*ROWS*1.6;
    colSpd[x] = 7 + Math.random()*16;
    colLen[x] = 9 + Math.random()*22;
  }
}
seedRain();

// resolve order for "decode": bright cells emerge first, so the figure
// arrives before the room does
const ORDER = new Float32Array(N);
{
  const idx = Array.from({length:N}, (_, i) => i);
  idx.sort((a,b) => (LUM[b]*0.62 + Math.random()*0.38) - (LUM[a]*0.62 + Math.random()*0.38));
  for (let k = 0; k < N; k++) ORDER[idx[k]] = k / (N-1);
}
let decodeP = 0;
let scanY = -20;

// ---- animation -------------------------------------------------------
let mode = 'shimmer', running = true, rate = 0.72, last = performance.now();
const boost = new Float32Array(N);

function step(dt){
  boost.fill(1);

  if (mode === 'shimmer'){
    const k = (N * 0.10 * rate) | 0;
    for (let n = 0; n < k; n++){
      const i = (Math.random()*N) | 0;
      const w = 4*LUM[i]*(1-LUM[i]);            // midtones shimmer most
      if (Math.random() < w) CUR[i] ^= 1;
    }
  }

  else if (mode === 'rain'){
    for (let x = 0; x < COLS; x++){
      colPos[x] += colSpd[x] * rate * dt;
      if (colPos[x] - colLen[x] > ROWS){
        colPos[x] = -Math.random()*ROWS*0.5;
        colSpd[x] = 7 + Math.random()*16;
        colLen[x] = 9 + Math.random()*22;
      }
      const head = colPos[x], len = colLen[x];
      const y0 = Math.max(0, Math.ceil(head - len)), y1 = Math.min(ROWS-1, Math.floor(head));
      for (let y = y0; y <= y1; y++){
        const d = (head - y) / len;
        const i = y*COLS + x;
        boost[i] = 1 + (1-d)*(1-d)*2.4 + (head - y < 1.2 ? 1.8 : 0);
        if (Math.random() < 0.30) CUR[i] ^= 1;
      }
    }
  }

  else if (mode === 'decode'){
    decodeP += 0.16 * rate * dt;
    if (decodeP > 1.55) decodeP = 0;
    const p = Math.min(decodeP, 1);
    for (let i = 0; i < N; i++){
      const o = ORDER[i];
      if (o < p - 0.05){ CUR[i] = BASE[i]; }
      else if (o < p + 0.10){
        boost[i] = 1 + (1 - Math.abs(o - p)/0.10) * 1.9;   // bright resolve front
        if (Math.random() < 0.5) CUR[i] ^= 1;
      }
      else { boost[i] = 0.30; if (Math.random() < 0.10) CUR[i] ^= 1; }
    }
  }

  else if (mode === 'scan'){
    scanY += 26 * rate * dt;
    if (scanY > ROWS + 22) scanY = -22;
    const band = 9;
    const y0 = Math.max(0, (scanY - band)|0), y1 = Math.min(ROWS-1, (scanY + band)|0);
    for (let y = y0; y <= y1; y++){
      const f = 1 - Math.abs(y - scanY)/band;
      for (let x = 0; x < COLS; x++){
        const i = y*COLS + x;
        boost[i] = 1 + f*f*2.0;
        if (Math.random() < 0.22*f) CUR[i] ^= 1;
      }
    }
  }
}

function draw(){
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, COLS*CW, ROWS*CH);

  frameId++;
  let keyN = 0;
  for (let i = 0; i < N; i++){
    const m = boost[i];
    let r = R[i]*m, g = G[i]*m, b = B[i]*m;
    if (r > 255) r = 255; if (g > 255) g = 255; if (b > 255) b = 255;
    const key = (((r|0) >> QS) << (QB*2)) | (((g|0) >> QS) << QB) | ((b|0) >> QS);
    if (stamp[key] !== frameId){
      stamp[key] = frameId;
      if (!bucket[key]) bucket[key] = [];
      bucket[key].length = 0;
      keyList[keyN++] = key;
    }
    bucket[key].push(i);
  }

  for (let k = 0; k < keyN; k++){
    const key = keyList[k], list = bucket[key];
    ctx.fillStyle = shade(key);
    for (let j = 0; j < list.length; j++){
      const i = list[j];
      ctx.fillText(GLYPH[CUR[i]], (i % COLS)*CW + CW/2, ((i/COLS)|0)*CH + CH/2);
    }
  }
}

function loop(now){
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  if (running) step(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---- controls --------------------------------------------------------
document.getElementById('modes').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  mode = btn.dataset.m;
  [...e.currentTarget.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
  CUR.set(BASE);
  if (mode === 'rain') seedRain();
  if (mode === 'decode') decodeP = 0;
  if (mode === 'scan') scanY = -20;
});

document.getElementById('sp').addEventListener('input', e => { rate = e.target.value/100; });

const tg = document.getElementById('toggle');
tg.addEventListener('click', () => {
  running = !running;
  tg.textContent = running ? '暂停' : '继续';
});

document.getElementById('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'threshold-frame.png';
  a.href = cv.toDataURL('image/png');
  a.click();
});

if (matchMedia('(prefers-reduced-motion: reduce)').matches){
  running = false; tg.textContent = '继续';
}

requestAnimationFrame(loop);
</script>
</body>
</html>
